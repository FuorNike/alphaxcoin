<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AlphaX</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #0b111e;
            color: #ffffff; font-family: sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            height: 100vh; overflow: hidden; user-select: none; box-sizing: border-box; padding: 60px 20px;
        }
        .title { font-size: 36px; font-weight: 900; color: #ffe082; }
        .coin-area { display: flex; align-items: center; justify-content: center; width: 100%; flex-grow: 1; }
        
        /* Мощная неоновая монета со 100% поддержкой на всех мобилках */
        .coin-wrapper {
            position: relative; width: 230px; height: 230px; border-radius: 50%;
            background: #141b2d; border: 5px solid #00e5ff;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .coin-logo { font-size: 110px; font-weight: 900; color: #ffffff; }
        
        /* Текст +1 */
        .click-float { position: absolute; color: #00e5ff; font-size: 36px; font-weight: bold; animation: floatUp 0.4s ease-out forwards; pointer-events: none; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-80px); } }
        
        .score-container { font-size: 54px; font-weight: 900; color: #00e5ff; }
        .score-label { color: #64748b; font-size: 14px; text-transform: uppercase; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="title">AlphaX Coin</div>

    <div class="coin-area">
        <!-- Поменяли обработчик на универсальный, который работает везде -->
        <div class="coin-wrapper" id="coinButton" onclick="doTap(event)">
            <span class="coin-logo">A</span>
        </div>
    </div>

    <div style="text-align: center; margin-bottom: 30px;">
        <div class="score-container" id="score">0</div>
        <div class="score-label">Баланс AXP</div>
    </div>

    <script>
        var score = 0;
        var scoreEl = document.getElementById('score');
        var coinButton = document.getElementById('coinButton');

        // Прямая, дубовая загрузка баланса
        try {
            var saved = localStorage.getItem('alphax_pure_score');
            if (saved) { score = parseInt(saved, 10) || 0; }
        } catch(e) {}
        scoreEl.innerText = score;

        // Железобетонная функция клика, завязанная прямо на тег в HTML
        function doTap(e) {
            score = score + 1;
            scoreEl.innerText = score;

            try {
                localStorage.setItem('alphax_pure_score', score);
            } catch (err) {}

            // Вылет +1
            var rect = coinButton.getBoundingClientRect();
            var clickFloat = document.createElement('div');
            clickFloat.classList.add('click-float');
            clickFloat.innerText = '+1';
            
            // Считаем координаты
            var x = e.clientX - rect.left;
            var y = e.clientY - rect.top;
            clickFloat.style.left = x + 'px';
            clickFloat.style.top = y + 'px';
            
            coinButton.appendChild(clickFloat);
            setTimeout(function() { clickFloat.remove(); }, 400);
        }
    </script>
</body>
</html>
